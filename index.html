<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Cut Hair Salon | Kashi</title>
  <style>
    :root {
      --bg: #0c0e12;
      --card-bg: rgba(24, 28, 36, 0.75);
      --card-border: rgba(212, 175, 55, 0.3);
      --gold: #d4af37;
      --gold-light: #f5e298;
      --text: #f0f3f6;
      --text-muted: #9ba3af;
      --whatsapp: #25D366;
      --instagram: #E1306C;
      --tiktok: #00f2fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #232733 0%, #0a0b0e 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 32px;
      padding: 36px 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(212, 175, 55, 0.12);
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Ambient Mirror Glow effect matching Kashi's salon photo */
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 18px;
    }

    .avatar-glow {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.6), transparent 70%);
      filter: blur(8px);
      z-index: 1;
    }

    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      z-index: 2;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      border-radius: 18px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
    }

    .link-card:hover, .link-card:active {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .link-card .left {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }

    .link-card .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-card .details h3 {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .link-card .details span {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .link-card .arrow {
      color: var(--text-muted);
      font-size: 18px;
      transition: transform 0.2s ease;
    }

    .link-card:hover .arrow {
      transform: translateX(3px);
      color: #fff;
    }

    /* Platform colors */
    .link-card.whatsapp {
      border-color: rgba(37, 211, 102, 0.35);
    }
    .link-card.whatsapp .icon-box {
      background: rgba(37, 211, 102, 0.15);
      color: #25D366;
    }
    .link-card.whatsapp:hover {
      background: rgba(37, 211, 102, 0.1);
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.25);
    }

    .link-card.instagram {
      border-color: rgba(225, 48, 108, 0.35);
    }
    .link-card.instagram .icon-box {
      background: linear-gradient(135deg, rgba(245, 133, 41, 0.2), rgba(221, 42, 123, 0.2), rgba(129, 52, 175, 0.2));
      color: #e1306c;
    }
    .link-card.instagram:hover {
      background: rgba(225, 48, 108, 0.1);
      box-shadow: 0 8px 24px rgba(225, 48, 108, 0.25);
    }

    .link-card.tiktok {
      border-color: rgba(0, 242, 254, 0.35);
    }
    .link-card.tiktok .icon-box {
      background: rgba(0, 242, 254, 0.15);
      color: #00f2fe;
    }
    .link-card.tiktok:hover {
      background: rgba(0, 242, 254, 0.1);
      box-shadow: 0 8px 24px rgba(0, 242, 254, 0.25);
    }

    .buttons-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-gold {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold), #b89125);
      color: #0b0c10;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-gold:hover {
      opacity: 0.92;
      transform: scale(0.99);
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--gold-light);
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-outline:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    /* Salon QR Code Preview Box */
    .qr-preview-box {
      margin-top: 20px;
      background: rgba(14, 16, 20, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 20px;
      padding: 18px;
      display: none;
    }

    .qr-preview-box.active {
      display: block;
      animation: fadeIn 0.4s ease-out;
    }

    .qr-preview-box img {
      width: 220px;
      height: 220px;
      border-radius: 12px;
      border: 2px solid var(--gold);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      margin-bottom: 8px;
    }

    .footer {
      margin-top: 26px;
      font-size: 12px;
      color: #636b79;
    }

    svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="container">

      <!-- Instagram Link -->

          </div>
          <div class="details">
            <h3>Instagram</h3>
            <span>@Kashi_g00</span>

        </div>
        <div class="arrow">&rarr;</div>
      </a>

      <!-- TikTok Link -->

    <div class="buttons-group">
      <!-- Save Contact Button -->

          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        Save Contact to Phone
      </a>

      <!-- Show QR Code Toggle Button -->
      <button onclick="toggleQR()" class="btn-outline">
        <svg viewBox="0 0 24 24" style="width: 18px; height: 18px;">
          <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-3 0h2v3h-2v-3zm3 3h3v5h-2v-3h-1v-2zm-3 2h2v3h-2v-3zm-2-2h2v2h-2v-2z"/>
        </svg>
        Show Salon QR Code

    </div>

    <!-- Collapsible Salon QR Code Box -->
    <div id="qrBox" class="qr-preview-box">
      <img src="salon_qr_with_photo.png" alt="Royal Cut Salon QR Code">
      <p style="font-size: 13px; color: var(--gold-light); font-weight: 600;">Scan to Save Contact &amp; Connect</p>
    </div>

    <div class="footer">
      &copy; Royal Cut Hair Salon &bull; Master Stylist Kashi
    </div>
  </div>

  <script>
    function toggleQR() {
      const box = document.getElementById('qrBox');
      box.classList.toggle('active');
    }
  </script>
</body>
</html>
